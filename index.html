<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clinica Local</title>
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <script src="script.js" defer></script>
</head>
<body data-pagina="registro" class="bg-light">
<main class="container py-4">
  <h1>Citas Clinica</h1>
  <p>Solicitar cita</p>
  <form id="cita" class="card p-3">
     <!--creamos el partado para ingresar el Nombre-->
    <label for="Nombre" class="form-label">Nombre</label>
    <input id="Nombre" name="Nombre" class="form-control mb-3"
      required minlength="3" maxlength="60"> 
      <!--creamos el partado para ingresar el Correo-->
    <label for="correo" class="form-label">Correo</label>
    <input id="correo" name="correo" type="email"
      class="form-control mb-3" required>
      <!--creamos el partado para ingresar la Especialidad-->
    <label for="Especialidad" class="form-label">Especialidad</label>
    <select id="Especialidad" name="Especialidad" class="form-select mb-3" required>
      <option value="">Selecciona</option>
      <option value="Odontologia">Odontologia</option>
      <option value="Traumatologia">Traumatologia</option>
      <option value="Pediatria">Pediatria</option>
    </select>
    <!--creamos el partado para ingresar la Fecha-->
    <label for="Fecha" class="form-label">Fecha</label>
    <input id="Fecha" name="Fecha" type="date" class="form-control mb-3"
      required >
      <!--creamos el partado para ingresar el Horario-->
    <label for="Horario" class="form-label">Horario</label>
    <select id="Horario" name="Horario" class="form-select mb-3" required>
      <option value="">Selecciona</option>
      <option value="09:00">09:00</option>
      <option value="10:00">10:00</option>
      <option value="11:00">11:00</option>
      <option value="15:00">15:00</option>
      <option value="16:00">16:00</option>
    </select>
    <button type="submit" class="btn btn-primary">Confirmar cita</button>
  </form>
  <p id="mensaje" role="status" class="mt-3"></p>
</main>
</body>
</html>
